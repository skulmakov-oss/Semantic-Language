# Active Harness task envelope. Checked by scripts/harness-check.ps1 (local and CI).
# Supported syntax is deliberately minimal: top-level sections, two-space scalar keys,
# and four-space "- item" lists under scope.*_paths. Anything else fails closed.
task:
  id: BOOTSTRAP-HARNESS-INTEGRATION
  title: "Introduce fail-closed per-task Harness scope enforcement"
  type: governance_infrastructure
  mode: active
  authorized_by: "Repository owner explicit GO 'OWNER GO - BOOTSTRAP HARNESS INTEGRATION' (2026-10-07), issue #14; trust-root extension 'OWNER AUTHORIZATION - CLOSE HARNESS TRUST-ROOT P1' (2026-10-07)"

intent:
  summary: "Install the Harness envelope, checker and CI enforcement. No compiler or language implementation."

scope:
  allowed_paths:
    - .harness/current.task.yaml
    - scripts/harness-check.ps1
    - .github/workflows/governance.yml
    - .github/workflows/harness-trusted.yml
    - AGENTS.md
    - CONTRIBUTING.md
  forbidden_paths:
    - bootstrap/**
    - compiler/**
    - reference/**
    - tests/**
    - docs/**
    - "*.sm"

authorization:
  rust_implementation: false
  language_implementation: false
  compiler_implementation: false
  documentation_addition: false
  documentation_correction: true
  test_addition: false
  workflow_changes: true
  dependency_changes: false
  github_issue_lifecycle: true
  git_commit_push_pr: true
  merge_after_review_and_checks: false
  stable_promotion: false

constraints:
  issue: 14
  base_branch: main
  base_sha: bc3e21e317c059df6ca9391862445b69161869ae
  one_logical_change_per_pr: true
  evidence_before_claims: true
  no_merge_without_owner_go: true
