# SHF-0 executable bootstrap contract (issue #11).
# Normative prose: docs/BOOTSTRAP_CONTRACT.md. Validator: bootstrap/validate_contract.py.
# Any change to a frozen value below is a contract revision (bump `protocol`), never an edit
# made to fit a failed bootstrap run.

protocol = "shf0-bootstrap-contract-v1"
status = "frozen"

# ---------------------------------------------------------------- C0
[c0]
repository = "skulmakov-oss/Semantic"
sha = "89641da8237f4fcefb50cf1958a50e4d4003aea7"   # must equal reference/semantic-reference.toml
reference_manifest = "reference/semantic-reference.toml"
required_reference_status = "qualified-reference"

# ---------------------------------------------------------------- S
[source_set]
manifest = "bootstrap/source-set.toml"
protocol = "shf0-source-set-v1"
root = "compiler"
extension = ".sm"
path_component = "^[a-z0-9_]+$"
ordering = "strictly-ascending-utf8-bytes"   # unsorted manifest is rejected, not re-sorted
duplicates = "reject"                        # including case-insensitive collisions
encoding = "utf-8-no-bom"
newline = "lf-only"                          # any CR byte is rejected (fail closed, no normalization)
final_newline = "required"
nul_bytes = "reject"

[source_set.identity]
algorithm = "sha256"
domain = "SHF0-SOURCE-SET\u0000v1\u0000"   # ASCII, prefixed to the framed stream
# framed stream: domain || u64be(file_count) || for each file in manifest order:
#                u32be(len(path)) || path || u64be(len(content)) || content
framing = "domain|u64be-count|(u32be-pathlen|path|u64be-contentlen|content)*"
format = "sha256:<64 lowercase hex>"

# ---------------------------------------------------------------- compiler interface
[compiler]
# Compile(source_set, declared_config, declared_capability_results) -> (artifact, diagnostics, status)
inputs = ["source_set", "declared_config", "declared_capability_results"]
outputs = ["artifact", "diagnostics", "status"]
statuses = ["ok", "rejected", "failed"]
declared_config = []        # no configuration inputs are admitted in protocol v1
artifact_format = "semcode" # upstream sm-format contract at C0

[deterministic_inputs]
allowed = ["c0_identity", "source_set_identity", "declared_config", "declared_capability_results"]
forbidden = [
    "wall_clock", "random_state", "filesystem_enumeration_order", "undeclared_env_vars",
    "absolute_host_paths", "process_or_thread_identity", "locale", "unrecorded_global_state",
]

# ---------------------------------------------------------------- fixed point
[fixed_point]
c1 = "C0(S)"
c2 = "C1(S)"
admission_required = ["C1", "C2"]   # both admitted by sm-verify
executed = ["C1"]                   # only admitted C1 runs (on sm-vm) to produce C2
comparison_rule = "byte-equality-v1"

[comparison_rules.byte-equality-v1]
definition = "C1.smc and C2.smc are equal as complete byte sequences"
basis = "sm-format @ C0 has canonical framing; DBG0 holds only (pc, line, col); no time/path/random fields"

# ---------------------------------------------------------------- host boundary
# permitted: allowed by policy. available_at_c0: exists at the C0 SHA. gap_stage: where a missing
# capability is planned. A known future gap does not fail SHF-0; it freezes the requirement.
[capabilities.source_read]
permitted = true
available_at_c0 = true          # fs.read: UTF-8 text, relative to one canonical root, 16 MiB/call
upstream = "docs/spec/controlled_application_boundary_v0.md"

[capabilities.artifact_write]
permitted = true
available_at_c0 = false         # only UTF-8 text writes exist; SemCode is binary
gap_owner = "skulmakov-oss/Semantic"
gap_stage = "SHF-2"

[capabilities.args_read]
permitted = true
available_at_c0 = true          # args.read; protocol v1 declares no config, so not required yet
upstream = "docs/spec/controlled_application_boundary_v0.md"

[capabilities.verifier_execution]
permitted = true
available_at_c0 = true          # sm-verify admission of C1 and C2
upstream = "crates/sm-verify"

[capabilities.vm_execution]
permitted = true
available_at_c0 = true          # sm-vm executes admitted C1 only
upstream = "crates/sm-vm"

[capabilities.environment_read]
permitted = false               # default environment inputs: none

[capabilities.clock_read]
permitted = false

[host]
required_capabilities = ["source_read", "artifact_write", "verifier_execution", "vm_execution"]
forbidden_logic = [
    "tokenization", "parsing", "symbol_binding", "typechecking", "ir_selection", "lowering",
    "opcode_selection", "semcode_construction", "diagnostic_meaning", "compiler_ordering",
]
violation = "HOST_LOGIC_LEAK"

# ---------------------------------------------------------------- failures
# continue = false: qualification stops; evidence from the failing run is not valid.
[failures.REFERENCE_MISMATCH]
trigger = "checkout HEAD differs from the pinned C0 SHA, tree is dirty, or C0 is not a qualified-reference"
response = "stop; re-verify or re-pin with drift analysis"
continue = false

[failures.CAPABILITY_GAP]
trigger = "S needs a language/runtime capability absent at C0"
response = "implement upstream first in its SHF stage; never in bootstrap glue"
continue = false

[failures.ADMISSION_REJECT]
trigger = "sm-verify rejects C1 or C2"
response = "fix the compiler; never relax admission"
continue = false

[failures.FIXED_POINT_DELTA]
trigger = "C1.smc != C2.smc under the frozen comparison rule"
response = "investigate; any unexplained delta blocks the Bootstrap Seal"
continue = false

[failures.NONDETERMINISM]
trigger = "repeated runs on identical declared inputs differ"
response = "find and declare or remove the hidden input"
continue = false

[failures.HOST_LOGIC_LEAK]
trigger = "host performs any forbidden_logic item"
response = "remove it; all evidence produced through that path is invalid"
continue = false

[failures.REFERENCE_DEFECT]
trigger = "C0 itself behaves incorrectly"
response = "fix upstream first, then re-pin"
continue = false

[failures.SOURCE_SET_INVALID]
trigger = "source-set manifest or file bytes violate shf0-source-set-v1"
response = "fix the manifest or file bytes; identity is undefined until valid"
continue = false

[failures.CONTRACT_DRIFT]
trigger = "evidence was bound to a different protocol, comparison rule or C0 than the contract"
response = "evidence is void; re-run under the current contract (rules are never weakened after a run)"
continue = false

# ---------------------------------------------------------------- evidence
# Shape of a bootstrap evidence record (upstream: docs/security/artifact_provenance_and_signing_policy_v0.md §7).
[evidence]
required_fields = [
    "contract_protocol", "c0_identity", "source_set_identity", "c1_artifact_hash",
    "c1_verifier_binding", "c2_artifact_hash", "c2_verifier_binding", "comparison_rule",
    "comparison_result",
    # Bootstrap Seal provenance (BOOTSTRAP_CONTRACT.md §7)
    "platform", "verifier_contract", "runtime_contract", "remaining_rust_responsibilities",
    # qualification evidence (BOOTSTRAP_CONTRACT.md §9, QUALIFICATION.md §3)
    "input_corpus", "positive_cases", "negative_cases", "boundary_cases", "mutation_proof",
    "unexplained_deltas",
]
# Values the qualification evidence must hold. input_corpus uses artifact_hash_format.
qualification_results = { cases = "pass", mutation_proof = "detected", unexplained_deltas = 0 }
# platform must be one of the C0 reference manifest's qualified platforms ([qualification].platform_scope).
# verifier_contract / runtime_contract must name the pinned C0 components:
verifier_contract = "skulmakov-oss/Semantic@89641da8237f4fcefb50cf1958a50e4d4003aea7:crates/sm-verify"
runtime_contract = "skulmakov-oss/Semantic@89641da8237f4fcefb50cf1958a50e4d4003aea7:crates/sm-vm"
# remaining_rust_responsibilities: exactly these categories, each once (all remain in Rust at the first Seal).
rust_responsibility_categories = ["oracle", "host_mechanics", "verifier_runtime_foundation"]
# A record supports the Bootstrap Seal only with these values; anything else is not evidence.
artifact_hash_format = "sha256:<64 lowercase hex>"   # c1/c2_artifact_hash, source_set_identity
verifier_binding_admitted = "admitted"               # c1/c2_verifier_binding
comparison_result_holds = "equal"                    # byte-equality-v1 also requires c1 hash == c2 hash

# ---------------------------------------------------------------- subset
[subset]
registry = "docs/BOOTSTRAP_SUBSET.md"
authority = "docs/spec/foundation_source_profile_v1.md"   # semantic.foundation.source/1.2 at C0
admitted = ["BSF-001", "BSF-002", "BSF-003", "BSF-004", "BSF-005", "BSF-006", "BSF-007", "BSF-008", "BSF-009", "BSF-010"]
candidate = ["BSF-101", "BSF-102", "BSF-103", "BSF-104", "BSF-105", "BSF-106"]
frozen = []
