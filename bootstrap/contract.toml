# SHF-0 executable bootstrap contract (Bootstrap Contract v4).
# Normative prose: docs/BOOTSTRAP_CONTRACT.md. Validator: bootstrap/validate_contract.py.
# Any change to a frozen value below is a contract revision (bump `protocol`), never an edit
# made to fit a failed bootstrap run.

protocol = "shf0-bootstrap-contract-v4"
status = "frozen"

# ---------------------------------------------------------------- C0
[c0]
repository = "skulmakov-oss/Semantic"
sha = "1d1e76c7509a03baa0133abaaa5819f5d32582b2"   # must equal reference/semantic-reference.toml
reference_manifest = "reference/semantic-reference.toml"
required_reference_status = "qualified-reference"

# ---------------------------------------------------------------- S
[source_set]
manifest = "bootstrap/source-set.toml"
protocol = "shf0-source-set-v1"
root = "compiler"
extension = ".sm"
path_component = "^[a-z0-9_]+$"
# Portable lengths on the qualified Windows platform (NTFS components, MAX_PATH 260 including the
# checkout directory): a component (with suffix) and the whole relative path are bounded.
max_component_length = 100
max_path_length = 160
# Windows device names cannot exist as files on the qualified C0 platform; no component may use one.
reserved_components = [
    "aux", "com1", "com2", "com3", "com4", "com5", "com6", "com7", "com8", "com9", "con",
    "lpt1", "lpt2", "lpt3", "lpt4", "lpt5", "lpt6", "lpt7", "lpt8", "lpt9", "nul", "prn",
]
ordering = "strictly-ascending-utf8-bytes"   # unsorted manifest is rejected, not re-sorted
duplicates = "reject"                        # including case-insensitive collisions
encoding = "utf-8-no-bom"
newline = "lf-only"                          # any CR byte is rejected (fail closed, no normalization)
final_newline = "required"
nul_bytes = "reject"

[source_set.identity]
algorithm = "sha256"
domain = "SHF0-SOURCE-SET\u0000v1\u0000"   # ASCII, prefixed to the framed stream
# framed stream: domain || u64be(file_count) || for each file in manifest order:
#                u32be(len(path)) || path || u64be(len(content)) || content
framing = "domain|u64be-count|(u32be-pathlen|path|u64be-contentlen|content)*"
format = "sha256:<64 lowercase hex>"

# ---------------------------------------------------------------- compiler interface
[compiler]
# Compile(source_set, declared_config, declared_capability_results) -> (artifact, diagnostics, status)
inputs = ["source_set", "declared_config", "declared_capability_results"]
outputs = ["artifact", "diagnostics", "status"]
statuses = ["ok", "rejected", "failed"]
declared_config = []        # no configuration inputs are admitted in protocol v3
artifact_format = "semcode" # upstream sm-format contract at C0

[deterministic_inputs]
allowed = ["c0_identity", "source_set_identity", "declared_config", "declared_capability_results"]
forbidden = [
    "wall_clock", "random_state", "filesystem_enumeration_order", "undeclared_env_vars",
    "absolute_host_paths", "process_or_thread_identity", "locale", "unrecorded_global_state",
]

# ---------------------------------------------------------------- fixed point
[fixed_point]
c1 = "C0(S)"
c2 = "C1(S)"
admission_required = ["C1", "C2"]   # both admitted by the executor's sm-verify (and by C0's)
executed = ["C1"]                   # only the stored, admitted C1 runs (through [executor]) to produce C2
comparison_rule = "byte-equality-v1"

# ---------------------------------------------------------------- stored-artifact execution
# The admitted execution path for the stored C1 (BOOTSTRAP_CONTRACT.md §10.5). It is NOT C0: C0
# compiles S into C1; this upstream revision admits the stored C1 bytes with its sm-verify and runs
# them on its sm-vm. It never compiles: source is never reconstructed from S.
[executor]
repository = "skulmakov-oss/Semantic"
sha = "825deca47f7e415e27b1e5f845a1c3030ea92300"
component = "crates/smc-cli"
command = "smc run-smc"                  # stored-artifact application mode
spec = "docs/spec/cli.md"
identity_binding = "expect-sha256"       # the bytes read must equal the declared C1 identity
admission = "verify_semcode_token_with_quotas"
profile = "cli-read-only"                # fs.read under --root, args, stdout; nothing else

# The trusted-compiler VM envelope (owner-approved for v4). It applies only to [executor] runs of
# C1 and C2 on S with --envelope trusted-compiler; VerifiedLocal application defaults are unchanged.
# These are VM quotas (instructions, calls, frames). They are not a memory or wall-clock bound.
[trusted_compiler_envelope]
envelope = "trusted-compiler"
max_steps = 150000000
max_calls = 2000000
max_frames = 256

[comparison_rules.byte-equality-v1]
definition = "C1.smc and C2.smc are equal as complete byte sequences"
basis = "sm-format @ C0 has canonical framing; DBG0 holds only (pc, line, col); no time/path/random fields"

# ---------------------------------------------------------------- host boundary
# permitted: allowed by policy. available_at_c0: exists at the C0 SHA. gap_stage: where a missing
# capability is planned. A known future gap does not fail SHF-0; it freezes the requirement.
[capabilities.source_read]
permitted = true
available_at_c0 = true          # fs.read: UTF-8 text, relative to one canonical root, 16 MiB/call
upstream = "docs/spec/controlled_application_boundary_v0.md"

[capabilities.artifact_write]
permitted = true
available_at_c0 = false         # only UTF-8 text writes exist in foundation source profile; SemCode transport uses hex formatting
gap_owner = "skulmakov-oss/Semantic"
gap_stage = "SHF-2"

[capabilities.args_read]
permitted = true
available_at_c0 = true          # args.read; protocol v3 declares no config, so not required yet
upstream = "docs/spec/controlled_application_boundary_v0.md"

[capabilities.verifier_execution]
permitted = true
available_at_c0 = true          # sm-verify admission of C1 and C2 (at C0 and at [executor])
upstream = "crates/sm-verify"

[capabilities.vm_execution]
permitted = true
available_at_c0 = true          # sm-vm executes admitted C1 only (the [executor] revision)
upstream = "crates/sm-vm"

[capabilities.environment_read]
permitted = false               # default environment inputs: none

[capabilities.clock_read]
permitted = false

[host]
required_capabilities = ["source_read", "artifact_write", "verifier_execution", "vm_execution"]
forbidden_logic = [
    "tokenization", "parsing", "symbol_binding", "typechecking", "ir_selection", "lowering",
    "opcode_selection", "semcode_construction", "diagnostic_meaning", "compiler_ordering",
]
violation = "HOST_LOGIC_LEAK"

# ---------------------------------------------------------------- failures
# continue = false: qualification stops; evidence from the failing run is not valid.
[failures.REFERENCE_MISMATCH]
trigger = "checkout HEAD differs from the pinned C0 SHA, tree is dirty, or C0 is not a qualified-reference"
response = "stop; re-verify or re-pin with drift analysis"
continue = false

[failures.CAPABILITY_GAP]
trigger = "S needs a language/runtime capability absent at C0"
response = "implement upstream first in its SHF stage; never in bootstrap glue"
continue = false

[failures.ADMISSION_REJECT]
trigger = "sm-verify rejects C1 or C2"
response = "fix the compiler; never relax admission"
continue = false

[failures.FIXED_POINT_DELTA]
trigger = "C1.smc != C2.smc under the frozen comparison rule"
response = "investigate; any unexplained delta blocks the Bootstrap Seal"
continue = false

[failures.NONDETERMINISM]
trigger = "repeated runs on identical declared inputs differ"
response = "find and declare or remove the hidden input"
continue = false

[failures.HOST_LOGIC_LEAK]
trigger = "host performs any forbidden_logic item"
response = "remove it; all evidence produced through that path is invalid"
continue = false

[failures.REFERENCE_DEFECT]
trigger = "C0 itself behaves incorrectly"
response = "fix upstream first, then re-pin"
continue = false

[failures.SOURCE_SET_INVALID]
trigger = "source-set manifest or file bytes violate shf0-source-set-v1"
response = "fix the manifest or file bytes; identity is undefined until valid"
continue = false

[failures.CONTRACT_DRIFT]
trigger = "evidence was bound to a different protocol, comparison rule or C0 than the contract"
response = "evidence is void; re-run under the current contract (rules are never weakened after a run)"
continue = false

# ---------------------------------------------------------------- evidence
# Shape of a bootstrap evidence record (upstream: docs/security/artifact_provenance_and_signing_policy_v0.md §7).
[evidence]
required_fields = [
    "contract_protocol", "c0_identity", "source_set_identity", "c1_artifact_hash",
    "c1_verifier_binding", "c2_artifact_hash", "c2_verifier_binding", "comparison_rule",
    "comparison_result",
    # Bootstrap Seal provenance (BOOTSTRAP_CONTRACT.md §7)
    "platform", "verifier_contract", "runtime_contract", "remaining_rust_responsibilities",
    # qualification evidence (BOOTSTRAP_CONTRACT.md §9, QUALIFICATION.md §3)
    "input_corpus", "positive_cases", "negative_cases", "boundary_cases", "mutation_proof",
    "unexplained_deltas", "input_corpus_size", "limitations",
    # C0 checkout attestation: the producer MUST obtain it from verify_reference_checkout()
    # before the run; post-run validation checks the values, not that the check ran (§10.7)
    "c0_checkout_head", "c0_checkout_clean",
    # v4: stored-artifact execution (BOOTSTRAP_CONTRACT.md §10.5, §10.7)
    "executor_identity", "effective_quotas", "c1_execution", "determinism",
]
# Values the qualification evidence must hold. input_corpus uses artifact_hash_format;
# input_corpus_size is a positive integer; limitations is a non-empty list of non-empty strings.
# positive_cases / negative_cases / boundary_cases are each {count, result}: count > 0, result =
# `cases` below, and the three counts sum to input_corpus_size (every class must really exist).
qualification_results = { cases = "pass", mutation_proof = "detected", unexplained_deltas = 0 }
# platform must be one of the C0 reference manifest's qualified platforms ([qualification].platform_scope).
# verifier_contract / runtime_contract must name the pinned C0 components:
# verifier_contract / runtime_contract name the components of [executor] (v4):
verifier_contract = "skulmakov-oss/Semantic@825deca47f7e415e27b1e5f845a1c3030ea92300:crates/sm-verify"
runtime_contract = "skulmakov-oss/Semantic@825deca47f7e415e27b1e5f845a1c3030ea92300:crates/sm-vm"
# executor_identity = "<repository>@<sha>:<component>" of [executor]; effective_quotas must equal
# [trusted_compiler_envelope] (max_steps, max_calls, max_frames); c1_execution = {outcome, counters}
# of the run of C1 on S, each counter within the envelope; determinism = repeated runs identical.
c1_execution_outcome = "ok"
determinism_result = "identical"
# remaining_rust_responsibilities: exactly these categories, each once (all remain in Rust at the first Seal).
rust_responsibility_categories = ["oracle", "host_mechanics", "verifier_runtime_foundation"]
# A record passes record validation only with these values. Seal acceptance additionally needs
# independent reproduction and owner acceptance (BOOTSTRAP_CONTRACT §10.7-§10.9, [seal]).
artifact_hash_format = "sha256:<64 lowercase hex>"   # c1/c2_artifact_hash, source_set_identity
verifier_binding_admitted = "admitted"               # c1/c2_verifier_binding
comparison_result_holds = "equal"                    # byte-equality-v1 also requires c1 hash == c2 hash

# ---------------------------------------------------------------- subset
[subset]
registry = "docs/BOOTSTRAP_SUBSET.md"
authority = "docs/spec/foundation_source_profile_v1.md"   # semantic.foundation.source/1.2 at C0: BSF-001..BSF-010
admitted = [
    "BSF-001", "BSF-002", "BSF-003", "BSF-004", "BSF-005", "BSF-006", "BSF-007", "BSF-008",
    "BSF-009", "BSF-010", "BSF-101", "BSF-103",
]
candidate = ["BSF-102", "BSF-104", "BSF-105", "BSF-106", "BSF-107"]
frozen = []

# Every ADMITTED / FROZEN entry outside BSF-001..BSF-010 is additive: it is admitted only by its
# own upstream contract at the exact C0 SHA. The same fields are documented in the registry
# (docs/BOOTSTRAP_SUBSET.md §5); the validator rejects any missing, malformed or differing value.
[subset.authorities.BSF-101]
repository = "skulmakov-oss/Semantic"
sha = "1d1e76c7509a03baa0133abaaa5819f5d32582b2"
path = "docs/spec/compiler_text_v0.md"
contract_id = "semantic.compiler.text/0.1"
qualification = ["tests/shf1b_compiler_text_qualification.rs", "tests/shf1c_lexer_probe.rs"]

[subset.authorities.BSF-103]
repository = "skulmakov-oss/Semantic"
sha = "1d1e76c7509a03baa0133abaaa5819f5d32582b2"
path = "docs/spec/compiler_u32_v0.md"
contract_id = "semantic.compiler.u32/0.1"
qualification = ["tests/shf3a_u32_qualification.rs"]

# ---------------------------------------------------------------- Bootstrap Seal (§10.9)
# States, in order. A state is reached only when every earlier one holds.
#   validated  - the evidence record passes check_evidence (record structure and consistency)
#   reproduced - an independent reproduction on a distinct host by a distinct operator, from the
#                same C0 and S, reports identical C1 and C2 identities and an equal comparison
#   accepted   - the owner accepted the reproduced Seal
# Attestations (operator names, host ids, acceptance) are recorded, not cryptographically proven.
[seal]
protocol = "shf0-bootstrap-seal-v1"
states = ["validated", "reproduced", "accepted"]
reproduction_distinct = ["host_id", "operator"]
reproduction_equal = ["c0_identity", "source_set_identity", "c1_artifact_hash", "c2_artifact_hash", "comparison_result"]
acceptance_by = "owner"
